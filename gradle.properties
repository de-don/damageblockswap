# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
# A fixed release, not a -SNAPSHOT: the same Loom on every build. 1.18.x needs a newer Gradle than the wrapper's 9.5.1.
loom_version=1.17.21

# Mod Properties
mod_version=1.1.0
maven_group=io.github.dedon

# Dependencies
fabric_api_version=0.154.0+26.1.2

# Optional config-UI libraries (client-only)
modmenu_version=18.0.0
# Fixed version: ClothConfigScreen relies on Cloth calling every entry's save() before the saving runnable
# (checked in AbstractConfigScreen.saveAll of 26.1.154). Re-check that before bumping it (docs/decisions.md).
cloth_config_version=26.1.154
