# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    # One jar is released for every Minecraft version listed here. A version is declared in
    # fabric.mod.json only if this matrix builds the mod and passes all tests and gametests on it.
    name: build (Minecraft ${{ matrix.minecraft }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: '26.1',   fabric_api: '0.155.3+26.1.2' }
          - { minecraft: '26.1.1', fabric_api: '0.155.3+26.1.2' }
          - { minecraft: '26.1.2', fabric_api: '0.155.3+26.1.2' }
          - { minecraft: '26.2',   fabric_api: '0.161.0+26.2' }
          - { minecraft: '26.3',   fabric_api: '0.167.0+26.3' }
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        # Caches the Gradle distribution, dependencies and Loom's Minecraft files between runs.
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }}
      - name: capture build artifacts
        if: matrix.minecraft == '26.1.2'
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
