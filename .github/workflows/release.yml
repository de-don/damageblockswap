# Build the mod and publish a GitHub Release whenever a version tag is pushed.
# Tag format: v<version>, e.g. v1.0.0 -> builds damageblockswap-1.0.0.jar and
# attaches it to a release named after the tag.

name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the release

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Use the cache of the build workflow, but don't let a release run write it.
          cache-read-only: true
      - name: derive version from tag
        id: version
        # v1.2.3 -> 1.2.3
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/damageblockswap-${{ steps.version.outputs.version }}.jar \
            --title "Damage Block Swap ${GITHUB_REF_NAME}" \
            --generate-notes
